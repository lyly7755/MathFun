<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b1410">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Math Fun</title>
<style>
  :root{
    --bg:#181210; --bg2:#241a15; --panel:#2e211a;
    --sel:#ffd166; --ghost:#6b543f; --ok:#5fbf7a; --txt:#f3e7d8; --dim:#a08b76;
    /* Card size is bound by BOTH axes: four cards across (60px covers padding, gaps
       and safe-area inset) and the height left over after the surrounding chrome
       (~225px of header, bar, operators, message and footer). Whichever is tighter
       wins, so the row never wraps and never runs off the bottom in landscape. */
    --cw: clamp(40px, min(calc((100vw - 60px) / 4), calc((100vh - 225px) / 1.42)), 104px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  @supports (height:100dvh){
    html,body{height:100dvh}
    /* dvh excludes the mobile URL bar, so cards can't overflow when it retracts */
    :root{ --cw: clamp(40px, min(calc((100vw - 60px) / 4), calc((100dvh - 225px) / 1.42)), 104px); }
  }
  body{
    background:radial-gradient(120% 90% at 50% 0%,var(--bg2),var(--bg));
    color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    display:flex;flex-direction:column;user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen{display:none;flex:1;min-height:0;position:relative}
  .screen.on{display:flex;flex-direction:column}

  /* ---- menu ---- */
  #menu{align-items:center;justify-content:center;gap:14px;padding:24px}
  .title{font-size:30px;font-weight:700;letter-spacing:.5px;text-align:center;line-height:1.15}
  .title .sub{display:block;font-size:13px;font-weight:400;color:var(--dim);letter-spacing:2.5px;margin-top:8px}
  .tiers{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:18px}
  .tier{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:17px 20px;border-radius:16px;border:1px solid rgba(255,255,255,.09);
    background:var(--panel);color:var(--txt);font:inherit;font-size:17px;font-weight:600;cursor:pointer;text-align:left;
  }
  .tier:active{background:#3b2a20}
  .tier em{display:block;font-style:normal;font-size:12px;font-weight:400;color:var(--dim);margin-top:3px}
  .tier .sc{font-size:13px;color:var(--sel);white-space:nowrap;font-weight:600}
  .total{color:var(--dim);font-size:13px;margin-top:4px}
  .tier.daily{background:#3a2a1c;border-color:rgba(255,209,102,.28)}
  .stats{
    display:flex;gap:0;width:100%;max-width:340px;margin-top:18px;
    border-top:1px solid rgba(255,255,255,.07);padding-top:14px
  }
  .stats div{flex:1;text-align:center}
  .stats b{display:block;font-size:19px;color:var(--txt);font-weight:700;line-height:1.2}
  .stats span{font-size:10.5px;color:var(--dim);letter-spacing:.7px;text-transform:uppercase}

  /* ---- install banner ---- */
  .installbar{
    display:flex;align-items:center;gap:10px;width:100%;max-width:340px;
    background:var(--panel);border:1px solid rgba(255,209,102,.25);border-radius:12px;
    padding:10px 12px;margin-top:16px;font-size:12.5px;color:var(--txt)
  }
  .installbar span{flex:1;line-height:1.35}
  .installbar .installbtn{
    background:var(--sel);color:#241a15;border:none;border-radius:8px;padding:7px 13px;
    font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap
  }
  .installbar .closebtn{
    background:none;border:none;color:var(--dim);font-size:19px;line-height:1;padding:0 2px;cursor:pointer
  }

  /* ---- language switcher ---- */
  .langsel{position:absolute;top:8px;right:8px;z-index:2}
  .langbtn{
    background:none;border:1px solid rgba(255,255,255,.15);color:var(--dim);font:inherit;
    font-size:12px;font-weight:700;letter-spacing:.5px;padding:5px 9px;border-radius:8px;cursor:pointer
  }
  .langbtn:active{background:rgba(255,255,255,.08)}
  .langlist{
    display:none;position:absolute;top:calc(100% + 6px);right:0;background:var(--panel);
    border:1px solid rgba(255,255,255,.1);border-radius:10px;overflow:hidden;min-width:76px;
    box-shadow:0 6px 18px rgba(0,0,0,.4)
  }
  .langlist.open{display:block}
  .langlist button{
    display:block;width:100%;padding:9px 12px;background:none;border:none;color:var(--txt);
    font:inherit;font-size:13px;font-weight:600;text-align:right;cursor:pointer
  }
  .langlist button:active{background:#3b2a20}
  .langlist button.cur{color:var(--sel)}

  /* ---- game ---- */
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
  .lvl{text-align:center;font-size:15px;font-weight:600;letter-spacing:.4px}
  .lvl small{display:block;font-weight:400;color:var(--dim);font-size:12px;letter-spacing:0;margin-top:2px}
  .navbtn{background:none;border:none;color:var(--dim);font-size:24px;padding:6px 14px;line-height:1;cursor:pointer;font-family:inherit}
  .navbtn:disabled{opacity:.25}
  .navbtn.home{position:absolute;top:4px;left:4px;z-index:1}
  .bar{display:flex;align-items:center;justify-content:center;gap:16px;font-size:13px;color:var(--dim);padding:2px 16px}
  .bar .stars{color:var(--sel);letter-spacing:2px}
  .bar .clock{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 10px;min-height:0}
  svg{width:100%;height:100%;max-height:42vh;max-width:760px;touch-action:manipulation}
  @supports (height:100dvh){ svg{max-height:42dvh} }

  .cell{fill:rgba(255,255,255,.028)}
  .stick{cursor:pointer}
  .stick.bad .body{fill:#e08b7a;stroke:rgba(0,0,0,.25)}
  .stick.bad .head{fill:#8d2f22}
  .stick .hit,.slot .hit{fill:transparent}
  .stick .body{fill:url(#g-wood);stroke:rgba(0,0,0,.3);stroke-width:.8}
  .stick .head{fill:url(#g-head)}
  /* near-white, not gold: the default wood body is already tan/gold, so a
     gold selection color has little hue contrast against it on a dim phone
     screen. White has a much bigger jump from both the wood and the dark
     background regardless of glow strength. */
  .stick.sel .body{fill:#fff8ea;stroke:#fff;stroke-width:1.3}
  .stick.sel{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 14px rgba(255,209,102,1))}
  .slot{cursor:pointer}
  .slot .body{fill:none;stroke:var(--ghost);stroke-width:3;stroke-dasharray:7 6;opacity:.9}
  .slot.blind .body{stroke:none}
  .stick.hint .body{fill:#8ad4ff;stroke:rgba(255,255,255,.3)}
  .stick.hint{filter:drop-shadow(0 0 11px rgba(138,212,255,.95))}
  .slot.hint .body{stroke:#8ad4ff;stroke-dasharray:none;opacity:1;stroke-width:3.5}
  .win .stick .body{fill:#8fe0a3;stroke:rgba(0,0,0,.2)}
  .win .stick .head{fill:#3f9d5b}

  /* ---- 24 game ---- */
  #cardarea{gap:10px;flex-wrap:nowrap;padding:6px 12px}
  .card{
    width:var(--cw);height:calc(var(--cw) * 1.42);
    border-radius:calc(var(--cw) * .14);background:linear-gradient(170deg,#fdf6e8,#e6d6bd);
    color:#1e1a17;display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-weight:700;cursor:pointer;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.45);
    border:2px solid transparent;flex:0 0 auto
  }
  .card .rank{font-size:calc(var(--cw) * .42);line-height:1}
  .card .suit{font-size:calc(var(--cw) * .22);margin-top:2px}
  .card.red{color:#b3261e}
  .card.sel{border-color:var(--sel);box-shadow:0 0 14px rgba(255,209,102,.9);transform:translateY(-6px)}
  .card.made{background:linear-gradient(170deg,#cfe9d5,#a8d3b4)}
  .card.gone{display:none}
  .card.win{background:linear-gradient(170deg,#8fe0a3,#5fbf7a);border-color:#3f9d5b}
  .card .frac{font-size:calc(var(--cw) * .26)}
  .ops{display:flex;gap:9px;justify-content:center;padding:2px 12px 0}
  .opbtn{
    width:54px;height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.1);
    background:var(--panel);color:var(--txt);font-size:23px;font-weight:700;cursor:pointer;font-family:inherit
  }
  .opbtn.on{background:var(--sel);color:#241a15;border-color:var(--sel)}
  .opbtn:disabled{opacity:.3}

  .msg{min-height:44px;text-align:center;font-size:15px;font-weight:600;letter-spacing:.3px;padding:0 16px}
  .msg.ok{color:var(--ok)}
  .msg.no{color:#e08b7a}
  .msg .big{display:block;color:var(--sel);font-size:26px;letter-spacing:5px;margin-bottom:2px}
  .msg .sharebtn{
    display:inline-block;margin-left:8px;padding:3px 12px;border-radius:999px;
    border:1px solid rgba(255,209,102,.5);background:rgba(255,209,102,.12);
    color:var(--sel);font:inherit;font-size:13px;font-weight:700;cursor:pointer;vertical-align:middle
  }
  .msg .sharebtn:active{background:rgba(255,209,102,.28)}

  /* short phones (SE, and anything with the keyboard-less landscape squeeze) */
  @media (max-height:640px){
    header{padding:8px 12px 2px}
    .msg{min-height:32px;font-size:14px}
    .msg .big{font-size:22px}
    button.act{padding:12px 6px}
    footer{padding:4px 12px 12px !important}
    .opbtn{height:44px}
  }
  /* phone in landscape: height, not width, is the binding constraint */
  @media (orientation:landscape) and (max-height:520px){
    svg{max-height:52vh}
    .msg{min-height:24px}
    #cardarea{padding:2px 12px}
  }
  /* tablet: centre and cap rather than stretch */
  @media (min-width:600px){
    .tiers{max-width:420px}
    .stats{max-width:420px}
    .title{font-size:34px}
  }

  footer{display:flex;gap:10px;padding:6px 16px 20px;justify-content:center}
  button.act{
    flex:1;max-width:170px;padding:15px 6px;border-radius:14px;
    border:1px solid rgba(255,255,255,.1);background:var(--panel);
    color:var(--txt);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer
  }
  button.act:active{background:#3b2a20}
  button.act:disabled{opacity:.35}
  button.act.primary{background:#7a4a2a;border-color:rgba(255,255,255,.15)}
</style>
</head>
<body>

<div class="screen on" id="home">
  <div class="langsel" id="langsel">
    <button class="langbtn" id="langbtn">EN</button>
    <div class="langlist" id="langlist"></div>
  </div>
  <div class="title">
    <span class="i18n" data-i18n="appName">Math Fun</span>
    <span class="sub i18n" data-i18n="pickGame">PICK YOUR GAME</span>
  </div>
  <div class="installbar" id="installbar" style="display:none">
    <span id="installtext"></span>
    <button class="installbtn" id="installbtn" style="display:none"></button>
    <button class="closebtn" id="installclose">&times;</button>
  </div>
  <div class="tiers">
    <button class="tier" id="pick-match">
      <span><span class="i18n" data-i18n="matchTitle">Matchstick Math</span><em class="i18n" data-i18n="matchDesc">move sticks to fix a broken equation</em></span><span class="sc" id="hs-match"></span>
    </button>
    <button class="tier" id="pick-g24">
      <span><span class="i18n" data-i18n="g24Title">24 Game</span><em class="i18n" data-i18n="g24Desc">combine four cards to make 24</em></span><span class="sc" id="hs-g24"></span>
    </button>
  </div>
  <div class="stats" id="homestats"></div>
</div>

<div class="screen" id="menu">
  <button class="navbtn home" id="homebtn">&#8592;</button>
  <div class="title">
    <span class="i18n" data-i18n="matchTitle">Matchstick Math</span>
    <span class="sub i18n" data-i18n="matchSubtitle">MOVE • THINK • SOLVE</span>
  </div>
  <div class="tiers">
    <button class="tier daily" id="dailybtn">
      <span><span class="i18n" data-i18n="dailyPuzzle">Daily Puzzle</span><em id="dailysub">&nbsp;</em></span><span class="sc" id="sc-daily"></span>
    </button>
    <button class="tier" data-tier="easy">
      <span><span class="i18n" data-i18n="easyLabel">Easy</span><em class="i18n" data-i18n="easyDesc">60 puzzles &middot; move 1 stick &middot; easiest first</em></span><span class="sc" id="sc-easy"></span>
    </button>
    <button class="tier" data-tier="medium">
      <span><span class="i18n" data-i18n="mediumLabel">Medium</span><em class="i18n" data-i18n="mediumDesc">60 puzzles &middot; bigger numbers &middot; easiest first</em></span><span class="sc" id="sc-medium"></span>
    </button>
    <button class="tier" data-tier="hard">
      <span><span class="i18n" data-i18n="hardLabel">Hard</span><em class="i18n" data-i18n="hardDesc">60 puzzles &middot; 2 sticks, no guides &middot; easiest first</em></span><span class="sc" id="sc-hard"></span>
    </button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="total" id="total"></div>
</div>

<div class="screen" id="menu24">
  <button class="navbtn home" id="home24btn">&#8592;</button>
  <div class="title">
    <span class="i18n" data-i18n="g24Title">24 Game</span>
    <span class="sub i18n" data-i18n="g24Subtitle">FOUR CARDS &bull; MAKE 24</span>
  </div>
  <div class="tiers">
    <button class="tier daily" id="daily24btn">
      <span><span class="i18n" data-i18n="dailyHand">Daily Hand</span><em id="daily24sub">&nbsp;</em></span><span class="sc" id="sc24-daily"></span>
    </button>
    <button class="tier" data-t24="easy">
      <span><span class="i18n" data-i18n="easyLabel">Easy</span><em class="i18n" data-i18n="easy24Desc">60 hands &middot; many ways to solve</em></span><span class="sc" id="sc24-easy"></span>
    </button>
    <button class="tier" data-t24="medium">
      <span><span class="i18n" data-i18n="mediumLabel">Medium</span><em class="i18n" data-i18n="medium24Desc">60 hands &middot; a handful of ways</em></span><span class="sc" id="sc24-medium"></span>
    </button>
    <button class="tier" data-t24="hard">
      <span><span class="i18n" data-i18n="hardLabel">Hard</span><em class="i18n" data-i18n="hard24Desc">60 hands &middot; 3 ways or fewer</em></span><span class="sc" id="sc24-hard"></span>
    </button>
  </div>
  <div class="total" id="total24"></div>
</div>

<div class="screen" id="g24">
  <header>
    <button class="navbtn" id="b24">&#8592;</button>
    <div class="lvl"><span id="lvlnum24">24 Game</span><small id="sub24"></small></div>
    <button class="navbtn" id="next24">&#8250;</button>
  </header>
  <div class="bar">
    <span class="stars" id="stars24">&#9734;&#9734;&#9734;</span>
    <span class="clock" id="clock24">0:00</span>
    <span id="par24"></span>
  </div>
  <main id="cardarea"></main>
  <div class="ops" id="ops"></div>
  <div class="msg" id="msg24"></div>
  <footer>
    <button class="act i18n" id="hint24" data-i18n="hint">Hint</button>
    <button class="act i18n" id="undo24" data-i18n="undo">Undo</button>
    <button class="act i18n" id="reset24" data-i18n="reset">Reset</button>
    <button class="act primary" id="go24">Skip &#8250;</button>
  </footer>
</div>

<div class="screen" id="game">
  <header>
    <button class="navbtn" id="back">&#8592;</button>
    <div class="lvl"><span id="lvlnum">Level 1</span><small id="sub"></small></div>
    <button class="navbtn" id="next">&#8250;</button>
  </header>
  <div class="bar">
    <span class="stars" id="lvlstars">&#9734;&#9734;&#9734;</span>
    <span class="clock" id="clock">0:00</span>
    <span id="par"></span>
  </div>
  <main><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></main>
  <div class="msg" id="msg"></div>
  <footer>
    <button class="act i18n" id="hint" data-i18n="hint">Hint</button>
    <button class="act i18n" id="undo" data-i18n="undo">Undo</button>
    <button class="act i18n" id="reset" data-i18n="reset">Reset</button>
    <button class="act primary" id="go">Skip &#8250;</button>
  </footer>
</div>

/* ---------- daily puzzle ----------
   Day number is UTC-based so it is pure arithmetic on Date.now() - no Date parsing,
   no timezone surprises, and it stays testable with a stubbed clock. */
function dayNo(){ return Math.floor(Date.now()/86400000); }
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function civil(z){                      /* days-since-epoch -> {y,m,d}, Hinnant's algorithm */
  z += 719468;
  var era = Math.floor(z/146097);
  var doe = z - era*146097;
  var yoe = Math.floor((doe - Math.floor(doe/1460) + Math.floor(doe/36524) - Math.floor(doe/146096))/365);
  var y = yoe + era*400;
  var doy = doe - (365*yoe + Math.floor(yoe/4) - Math.floor(yoe/100));
  var mp = Math.floor((5*doy + 2)/153);
  var d = doy - Math.floor((153*mp + 2)/5) + 1;
  var m = mp + (mp < 10 ? 3 : -9);
  return {y: y + (m <= 2 ? 1 : 0), m: m, d: d};
}
function dayLabel(z){
  var c=civil(z);
  var months=(I18N[lang] && I18N[lang].months) || MON;
  return tr('dateFormat', {mon:months[c.m-1], day:c.d, monNum:c.m});
}
function hash32(n){                     /* deterministic scramble so consecutive days differ */
  n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15);
  return n >>> 0;
}
function dailyIdx(z){ return hash32(z) % PACKS.daily.length; }

/* ---------- seven-segment model ---------- */
var SEG = {'0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc','5':'afgcd',
           '6':'afgedc','7':'abc','8':'abcdefg','9':'abcdfg'};
var DS='abcdefg', OS='hv', ES='xy';
function bit(ch, alph){ return 1 << alph.indexOf(ch); }
function maskOf(str, alph){ var m=0; for(var i=0;i<str.length;i++) m|=bit(str[i],alph); return m; }
var DMASK={}, MASK2D={};
for(var d in SEG){ DMASK[d]=maskOf(SEG[d],DS); MASK2D[DMASK[d]]=d; }
/* A slot showing nothing but verticals reads as the 1s those verticals form.
   The canonical 1 sits on the right pair, but the left pair looks identical, and
   both pairs together are simply two 1s - which is how anyone reads it on a table. */
MASK2D[maskOf('ef',DS)]   = '1';
MASK2D[maskOf('bcef',DS)] = '11';
var OMASK={'-':maskOf('h',OS),'+':maskOf('hv',OS)}, MASK2O={};
for(var o in OMASK) MASK2O[OMASK[o]]=o;
var NBITS={d:7,o:2,e:2};
function alphOf(t){ return t==='d'?DS : t==='o'?OS : ES; }

function encode(str){
  var out=[];
  for(var i=0;i<str.length;i++){
    var ch=str[i];
    if(ch>='0'&&ch<='9') out.push({t:'d',v:DMASK[ch]});
    else if(ch==='+'||ch==='-') out.push({t:'o',v:OMASK[ch]});
    else out.push({t:'e',v:3});
  }
  return out;
}
function decode(tk){
  var out='';
  for(var i=0;i<tk.length;i++){
    var k=tk[i], c;
    if(k.t==='d') c=MASK2D[k.v];
    else if(k.t==='o') c=MASK2O[k.v];
    else c = (k.v===3) ? '=' : undefined;
    if(c===undefined) return null;
    out+=c;
  }
  return out;
}
/* hand-rolled arithmetic - deliberately no eval()/Function(), which CSP can block */
function evalSide(s){
  if(!/^\d+([+\-]\d+)*$/.test(s)) return null;
  var nums=s.split(/[+\-]/), ops=s.match(/[+\-]/g)||[], i;
  for(i=0;i<nums.length;i++) if(nums[i].length>1 && nums[i][0]==='0') return null;
  var acc=parseInt(nums[0],10);
  for(i=0;i<ops.length;i++){
    var n=parseInt(nums[i+1],10);
    acc = (ops[i]==='+') ? acc+n : acc-n;
  }
  return acc;
}
function isTrue(e){
  if(!e) return false;
  var parts=e.split('=');
  if(parts.length!==2) return false;
  var a=evalSide(parts[0]), b=evalSide(parts[1]);
  return a!==null && b!==null && a===b;
}

function fr(n,d){                                  /* normalised fraction */
  d = (d===undefined) ? 1 : d;

  var a=Math.abs(n), b=Math.abs(d);

function fMul(x,y){ return fr(x.n*y.n, x.d*y.d); }
function fDiv(x,y){ return y.n===0 ? null : fr(x.n*y.d, x.d*y.n); }
function fEq(x,y){ return x.n===y.n && x.d===y.d; }

var LANGS=[{code:'en',label:'EN'},{code:'es',label:'ES'},{code:'fr',label:'FR'},{code:'zh',label:'中文'}];
function detectLang(){
  try{ var saved=localStorage.getItem('ms_lang'); if(saved && I18N[saved]) return saved; }catch(err){}
  try{ var nav=(navigator.language||'').slice(0,2).toLowerCase(); if(I18N[nav]) return nav; }catch(err){}
  return 'en';
}
var lang = detectLang();
/* named tr(), not t() - this codebase already uses "t" everywhere as a local
   var/param (flash(t,c), var t=curTime(), function openTier(t), ...); a
   global function called t() would get silently shadowed by every one of
   those and crash the first time translated text was needed inside them. */
function tr(key, vars){
  var s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  if(vars) for(var k in vars) s = s.split('{'+k+'}').join(vars[k]);
  return s;
}
function pluralWord(n, singularKey, pluralKey){ return tr(n>1 ? pluralKey : singularKey); }
function applyI18n(){
  var els = document.querySelectorAll('.i18n');
  for(var i=0;i<els.length;i++){
    var key = els[i].getAttribute('data-i18n');
    if(key) els[i].textContent = tr(key);
  }
  buildLangMenu();
}
function buildLangMenu(){
  var html='', i;
  for(i=0;i<LANGS.length;i++){
    html += '<button data-lang="'+LANGS[i].code+'" class="'+(LANGS[i].code===lang?'cur':'')+'">'+LANGS[i].label+'</button>';
  }
  $('langlist').innerHTML = html;
  var cur=LANGS[0];
  for(i=0;i<LANGS.length;i++) if(LANGS[i].code===lang) cur=LANGS[i];
  $('langbtn').innerHTML = cur.label + ' <span class="car">&#9662;</span>';
}
function currentScreen(){
  var ids=['home','menu','menu24','game','g24'];
  for(var i=0;i<ids.length;i++) if($(ids[i]).className==='screen on') return ids[i];
  return 'home';
}
function setLang(l){
  if(!I18N[l] || l===lang){ return; }
  lang=l;
  try{ localStorage.setItem('ms_lang', l); }catch(err){}
  applyI18n();
  var s=currentScreen();
  if(s==='home') showHome();
  else if(s==='menu') showMenu();

var tier='easy', idx=0, tok=[], hist=[], sel=null, solved=false;
var t0=0, elapsed=0, ticking=false, clean=true, timerId=null;
var hint=null, usedHint=false, badCells=[];

function $(id){ return document.getElementById(id); }
var board=$('board');

function fmt(sec){
  var m=Math.floor(sec/60), s=Math.floor(sec%60);
  return m+':'+(s<10?'0':'')+s;
}
function now(){ return Date.now()/1000; }
function curTime(){ return ticking ? elapsed + (now()-t0) : elapsed; }

function armTimer(){
  if(!timerId && ticking){
    try{ timerId=setInterval(tick,250); }catch(err){ timerId=null; }
  }
}
function startClock(){
  if(ticking || solved) return;
  ticking=true; t0=now();
  armTimer();
}
function stopClock(){
  if(ticking){ elapsed += now()-t0; ticking=false; }
  if(timerId){ clearInterval(timerId); timerId=null; }
}
/* The clock is derived from timestamps, never accumulated by the interval, so the
   time and the star award stay correct even if setInterval never fires. draw()
   repaints it on every interaction, so it advances as you play regardless. */
function tick(){ $('clock').textContent = fmt(curTime()); }

/* stars: 3 = under par and untouched by undo/reset, 2 = under double par, 1 = solved */
function parNow(){
  if(tier!=='daily') return TIERS[tier].par;
  return lev().m===1 ? 45 : 90;      /* a daily can be either length, so scale its par */
}
function award(){
  var par=parNow(), t=curTime();
  if(t<=par && clean) return 3;
  if(t<=par*2) return 2;
  return 1;
}

/* ---------- back-button / history ----------
   Android's hardware back button fires popstate instead of running our in-app
   back buttons, so every "enter a deeper screen" action pushes a history entry
   and popstate replays the matching shallower screen: board -> menu -> picker.
   Without this, back exits the app mid-puzzle instead of retracing screens.
   HIST_OK is false in the Node test harness (no window/history there), which
   makes pushScreen/goBackScreen no-ops so existing tests see unchanged behavior. */
var HIST_OK = (typeof window !== 'undefined') && !!(window.history && window.history.pushState);
function pushScreen(name){
  if(!HIST_OK) return;
  try{ window.history.pushState({screen:name}, ''); }catch(err){}
}
function goBackScreen(){
  if(!HIST_OK) return false;
  try{ window.history.back(); return true; }catch(err){ return false; }
}
function onPopState(ev){
  var screen = ev && ev.state && ev.state.screen;
  if(screen==='menu') showMenu();
  else if(screen==='menu24') showMenu24();
  else showHome();
}
if(HIST_OK) window.addEventListener('popstate', onPopState);

/* ---------- 24 game state ---------- */
var g24 = { tier:'easy', idx:0, cards:[], hist:[], sel:-1, op:null,
            solved:false, clean:true, usedHint:false, hint:null };
var SUITS=['\u2660','\u2665','\u2666','\u2663'];

function hand24(){ return HANDS24[g24.tier][g24.idx]; }
function handKey(h){ return '24:'+h[0].join(','); }
function rank(v){ return v===1?'A' : v===11?'J' : v===12?'Q' : v===13?'K' : String(v); }
function par24(){ return T24[g24.tier].par; }

function load24(i){
  var pack=HANDS24[g24.tier];
  g24.idx=(i+pack.length)%pack.length;
  var h=hand24();
  g24.cards = h[0].map(function(v,k){
    /* suits are cosmetic; derived from the hand so they are stable across reloads */
    return {val:fr(v), suit:SUITS[(v*7+k*3+g24.idx)%4], made:false, gone:false, label:rank(v)};
  });
  g24.hist=[]; g24.sel=-1; g24.op=null; g24.solved=false;
  g24.clean=true; g24.usedHint=false; g24.hint=null;
  stopClock(); elapsed=0; clean=true;
  $('clock24').textContent='0:00';
  $('msg24').textContent=''; $('msg24').className='msg';
  startClock();
  draw24();
}
function snap24(){
  return g24.cards.map(function(c){ return {val:{n:c.val.n,d:c.val.d}, suit:c.suit,
                                             made:c.made, gone:c.gone, label:c.label}; });
}
function live24(){
  var out=[];
  for(var i=0;i<g24.cards.length;i++) if(!g24.cards[i].gone) out.push(i);
  return out;
}

function draw24(){
  var html='', i;
  for(i=0;i<g24.cards.length;i++){
    var c=g24.cards[i];
    if(c.gone) continue;
    var red = (c.suit==='\u2665'||c.suit==='\u2666');
    var cls='card'+(red?' red':'')+(c.made?' made':'')+(g24.sel===i?' sel':'')
           +(g24.solved?' win':'')+(g24.hint&&g24.hint.cards.indexOf(i)>=0?' sel':'');
    var txt = c.val.d===1 ? String(c.val.n) : (c.val.n+'/'+c.val.d);
    html += '<div class="'+cls+'" data-c="'+i+'">'
          + '<span class="rank'+(txt.length>2?' frac':'')+'">'+(c.made?txt:c.label)+'</span>'
          + '<span class="suit">'+(c.made?'':c.suit)+'</span></div>';
  }
  $('cardarea').innerHTML=html;

  var ops='';
  for(i=0;i<OPS24.length;i++)
    ops += '<button class="opbtn'+(g24.op===OPS24[i].k?' on':'')+'" data-op="'+OPS24[i].k+'">'+OPS24[i].k+'</button>';
  $('ops').innerHTML=ops;

  var left=live24().length;
  $('sub24').textContent = g24.solved ? tr('solvedWord') : tr('cardsLeft', {n:left, word:pluralWord(left,'cardSingular','cardPlural')});
  $('lvlnum24').textContent = (g24.tier==='daily')
      ? tr('dailyLevel24', {date:dayLabel(dayNo())})
      : tr('levelOf', {tier:tr(g24.tier+'Label'), n:g24.idx+1, max:HANDS24[g24.tier].length});
  $('par24').textContent=tr('par', {t:fmt(par24())});
  $('stars24').textContent = starStr(g24.tier==='daily'
      ? (daily.done24[dayNo()]||0) : (stars[handKey(hand24())]||0));
  $('undo24').disabled = g24.hist.length===0 || g24.solved;
  $('reset24').disabled = g24.hist.length===0 && !g24.solved;
  $('go24').innerHTML = g24.tier==='daily' ? (g24.solved?tr('done'):tr('giveUp'))
                                           : (g24.solved?tr('next')+' &#8250;':tr('skip')+' &#8250;');
  $('next24').style.visibility = g24.tier==='daily' ? 'hidden' : '';
  $('next24').disabled = g24.tier==='daily';
  tick24(); armTimer();
}

/* ---------- level ---------- */
function pack(){ return PACKS[tier]; }
function lev(){ return pack()[idx]; }

function load(i){
  var P=pack();
  idx=(i+P.length)%P.length;
  tok=encode(lev().p); hist=[]; sel=null; solved=false;
  stopClock(); elapsed=0; clean=true;
  hint=null; usedHint=false; badCells=[];
  $('hint').style.display = (TIERS[tier].blind || (tier==='daily' && lev().m>1)) ? '' : 'none';
  $('clock').textContent='0:00';
  startClock();
  if(tier==='daily'){
    var z=dayNo();
    $('lvlnum').textContent = tr('dailyLevelMatch', {date:dayLabel(z)});
    $('lvlstars').textContent = starStr(daily.done[z]||0);
  } else {
    $('lvlnum').textContent = tr('levelOf', {tier:tr(tier+'Label'), n:idx+1, max:P.length});
    $('lvlstars').textContent = starStr(starsFor(tier,idx));
  }
  $('par').textContent = tr('par', {t:fmt(parNow())});
  $('msg').textContent=''; $('msg').className='msg';
  draw();
}

function draw(){
  var i, totalW=0;
  for(i=0;i<tok.length;i++) totalW += GEO[tok[i].t].w;
  totalW += GAP*(tok.length-1);
  var pad=16;
  board.setAttribute('viewBox', (-pad)+' '+(-pad)+' '+(totalW+pad*2)+' '+(CH+pad*2));

  var defs='<defs>'
    +'<linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="#f4cd97"/><stop offset="1" stop-color="#c08b4a"/></linearGradient>'
    +'<linearGradient id="g-head" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="#d9483a"/><stop offset="1" stop-color="#7d1f18"/></linearGradient>'
    +'</defs>';

  /* two passes: empty target slots are drawn last so they sit above sticks and stay tappable.
     In hard mode they are still tappable but invisible - you have to know where they are. */
  var blind = TIERS[tier].blind;
  var cells='', sticks='', slots='', x=0;
  for(i=0;i<tok.length;i++){
    if(tok[i].t==='d'){                       /* one panel = one digit slot */
      var cx=0;
      for(var q=0;q<i;q++) cx += GEO[tok[q].t].w + GAP;
      cells += '<rect class="cell" x="'+(cx-3)+'" y="-4" width="'+(GEO.d.w+6)+'" height="'+(CH+8)+'" rx="12"/>';
    }
  }
  for(i=0;i<tok.length;i++){
    var k=tok[i], g=GEO[k.t], alph=alphOf(k.t);
    for(var s in g.slots){
      var pos=g.slots[s];
      var filled=(k.v >> alph.indexOf(s)) & 1;
      var tf='translate('+(x+pos.x)+' '+pos.y+')'+(pos.r?' rotate(90)':'');
      var isSel = sel && sel.i===i && sel.s===s;
      var isBad = badCells.indexOf(i)>=0;
      var isHintSrc = hint && hint.src.i===i && hint.src.s===s;
      var isHintTgt = hint && hint.tgt.i===i && hint.tgt.s===s;
      if(filled){
        sticks += '<g class="stick'+(isSel?' sel':'')+(isHintSrc?' hint':'')+(isBad?' bad':'')+'" data-i="'+i+'" data-s="'+s+'" transform="'+tf+'">'
          + '<rect class="hit" x="-6" y="-13" width="'+(L+12)+'" height="26"/>'
          + '<rect class="body" x="0" y="-5.5" width="'+L+'" height="11" rx="5.5"/>'
          + '<rect class="head" x="'+(L-16)+'" y="-5.5" width="16" height="11" rx="5.5"/>'
          + '</g>';
      } else if(sel || isHintTgt){
        /* a hinted target stays visible even in hard mode - that is the whole point */
        var scls = 'slot' + ((blind && !isHintTgt) ? ' blind' : '') + (isHintTgt ? ' hint' : '');
        slots += '<g class="'+scls+'" data-i="'+i+'" data-s="'+s+'" transform="'+tf+'">'
          + '<rect class="hit" x="-6" y="-13" width="'+(L+12)+'" height="26"/>'
          + '<rect class="body" x="1" y="-4.5" width="'+(L-2)+'" height="9" rx="4.5"/>'
          + '</g>';
      }
    }
    x += g.w + GAP;
  }
  board.innerHTML = defs + cells + sticks + slots;
  if(solved) board.classList.add('win'); else board.classList.remove('win');

  var M=lev().m;
  $('sub').textContent = solved ? tr('solvedWord') : tr('movesUsed', {used:hist.length, max:M, word:pluralWord(M,'moveSingular','movePlural')});
  $('undo').disabled = (hist.length===0) || solved;
  $('reset').disabled = (hist.length===0) && !solved;
  var isDaily = (tier==='daily');
  $('go').innerHTML = isDaily ? (solved ? tr('done') : tr('giveUp')) : (solved ? tr('next')+' &#8250;' : tr('skip')+' &#8250;');
  $('next').style.visibility = isDaily ? 'hidden' : '';
  $('next').disabled = isDaily;
  tick(); armTimer();
}

/* ---------- hint: reveal ONE of the moves ----------
   Diff the board against the answer: sticks that must leave vs. gaps that must fill.
   Moves commute (each is one bit off, one bit on), so any pairing reaches the same
   answer - we just surface the first pair. */
function hintDiff(){
  var tgt=encode(lev().s[0]), rem=[], add=[], i, b;
  for(i=0;i<tok.length;i++){
    var alph=alphOf(tok[i].t);
    for(b=0;b<NBITS[tok[i].t];b++){
      var cur=(tok[i].v>>b)&1, want=(tgt[i].v>>b)&1;
      if(cur && !want) rem.push({i:i,s:alph[b]});
      else if(!cur && want) add.push({i:i,s:alph[b]});
    }
  }
  return {rem:rem, add:add};
}
function showHint(){
  if(solved) return;
  var d=hintDiff();
  if(!d.rem.length){ flash(tr('hintAlreadyMatches'),''); return; }
  if(d.rem.length > (lev().m - hist.length)){
    flash(tr('hintTooFar'),'no');
    return;
  }
  hint={src:d.rem[0], tgt:d.add[0]};
  sel=null;
  clean=false; usedHint=true;
  flash(tr('hintMoveStick'),'');
  draw();
}

/* ---------- 24 interaction: tap a card, tap an operator, tap a second card ---------- */
function pick24(i){
  if(g24.solved) return;
  startClock();
  if(g24.sel===i){ g24.sel=-1; draw24(); return; }
  if(g24.sel<0 || g24.op===null){ g24.sel=i; draw24(); return; }
  combine24(g24.sel, i);
}
function chooseOp(k){
  if(g24.solved) return;
  startClock();
  g24.op = (g24.op===k) ? null : k;
  draw24();
}
function combine24(a,b){
  var op=opByKey(g24.op);
  if(!op || a===b) return;
  var v=op.f(g24.cards[a].val, g24.cards[b].val);
  if(v===null){ flash24(tr('divByZero'),'no'); return; }
  g24.hist.push(snap24());
  g24.cards[b] = {val:v, suit:'', made:true, gone:false,
                  label: v.d===1 ? String(v.n) : (v.n+'/'+v.d)};
  g24.cards[a].gone = true;
  g24.sel=-1; g24.op=null; g24.hint=null;
  check24();
  draw24();
}
function check24(){
  var live=live24();
  if(live.length===1){
    var v=g24.cards[live[0]].val;
    if(fEq(v,TARGET24)){
      g24.solved=true; stopClock();
      var n=award24();
      if(g24.tier==='daily') recordDaily24(dayNo(), n);
      else setStarKey(handKey(hand24()), n);
      var t=curTime(), why = (n===3)?tr('underPar')
                    : g24.usedHint ? tr('hintUsed')
                    : (!g24.clean)  ? tr('undoUsed') : tr('parIs',{t:fmt(par24())});
      var shareBtn='';
      if(g24.tier==='daily'){
        lastShare.g24 = shareText(tr('g24Title'), n, t, dayNo());
        shareBtn = ' <button class="sharebtn" data-share="g24">'+tr('shareBtn')+'</button>';
      }
      $('msg24').className='msg ok';
      $('msg24').innerHTML='<span class="big">'+starStr(n)+'</span>24 &nbsp;&middot;&nbsp; '
                          +fmt(t)+' &nbsp;&middot;&nbsp; '+why+shareBtn;
      return;
    }
    flash24(tr('g24Makes',{v:fStr(v)}),'no');
    return;
  }
  /* still cards left: warn early if 24 is now unreachable */
  var vals=live.map(function(i){ return g24.cards[i].val; });
  if(!solvable24(vals)) flash24(tr('g24Unreachable'),'no');
  else $('msg24').textContent='';
}
function award24(){
  var t=curTime(), par=par24();
  if(t<=par && g24.clean && !g24.usedHint) return 3;
  if(t<=par*2) return 2;
  return 1;
}
function flash24(t,c){ var m=$('msg24'); m.textContent=t; m.className='msg '+(c||''); }
function hint24(){
  if(g24.solved) return;
  var live=live24();
  var vals=live.map(function(i){ return g24.cards[live.indexOf(i)>=0?i:i].val; });
  var step=solve24(vals);
  if(!step){ flash24(tr('hint24NoWay'),'no'); return; }
  if(step.done){ flash24(tr('hint24Already24'),''); return; }
  g24.hint={cards:[live[step.i], live[step.j]], op:step.op};
  g24.clean=false; g24.usedHint=true;
  flash24(tr('hint24Try',{op:step.op}), '');
  draw24();
}

/* ---------- share ----------
   Wordle-style: spoiler-free (no puzzle/answer, just stars/time/streak) so it
   can't give away the day's puzzle to someone who hasn't played yet. Scoped to
   dailies only - that's the one puzzle everyone's playing the same day, which
   is what makes sharing a result meaningful instead of just noise. */
var lastShare = {match:'', g24:''};
function shareText(game, n, t, z){
  var lines = [
    tr('shareLine1', {game:game, date:dayLabel(z)}),
    starStr(n) + '   ' + fmt(t),
    tr('shareStreak', {n:daily.streak})
  ];
  try{ if(location.href) lines.push(location.href); }catch(err){}
  return lines.join('\n');
}
function doShare(text, onDone){
  if(typeof navigator !== 'undefined' && navigator.share){
    navigator.share({text:text}).catch(function(){});
    if(onDone) onDone('shared');
    return;
  }
  if(typeof navigator !== 'undefined' && navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){});
    if(onDone) onDone('copied');
    return;
  }
  if(onDone) onDone('unavailable');
}
function wireShare(msgEl, key){
  msgEl.addEventListener('click', function(ev){
    var el=ev.target;
    while(el && el!==msgEl && !(el.getAttribute && el.getAttribute('data-share'))) el=el.parentNode;
    if(!el || !el.getAttribute || !el.getAttribute('data-share')) return;
    var original=el.textContent;
    doShare(lastShare[key], function(result){
      if(result==='unavailable' || typeof window==='undefined') return;
      el.textContent = (result==='copied') ? tr('copied') : tr('shared');
      setTimeout(function(){ el.textContent=original; }, 1500);
    });
  });
}

/* ---------- interaction ---------- */
board.addEventListener('click', function(ev){
  if(solved) return;
  /* walk up from the tapped <rect> to its <g> - closest() is unreliable on SVG in older engines */
  var el=ev.target;
  while(el && el!==board && !(el.getAttribute && el.getAttribute('data-s'))) el=el.parentNode;
  if(!el || el===board || !el.getAttribute('data-s')){ sel=null; draw(); return; }

  var i=parseInt(el.getAttribute('data-i'),10), s=el.getAttribute('data-s');
  var isStick = el.getAttribute('class').indexOf('stick')===0;

  startClock();

  if(isStick){
    sel = (sel && sel.i===i && sel.s===s) ? null : {i:i, s:s};
    draw();
    return;
  }
  if(!sel) return;
  if(hist.length >= lev().m){ flash(tr('noMovesLeft'),'no'); return; }

  hist.push(tok.map(function(z){ return {t:z.t, v:z.v}; }));
  hint=null; badCells=[];
  tok[sel.i].v &= ~bit(sel.s, alphOf(tok[sel.i].t));
  tok[i].v    |=  bit(s,     alphOf(tok[i].t));
  sel=null;
  check();
  draw();
});

/* which slots don't read as a digit / operator / equals sign */
function malformed(){
  var out=[];
  for(var i=0;i<tok.length;i++){
    var k=tok[i], ok;
    if(k.t==='d') ok = MASK2D[k.v]!==undefined;
    else if(k.t==='o') ok = MASK2O[k.v]!==undefined;
    else ok = (k.v===3);
    if(!ok) out.push(i);
  }
  return out;
}
function check(){
  var e=decode(tok);
  if(e && isTrue(e)){
    solved=true;
    stopClock();
    var n=award();
    if(tier==='daily'){
      var z=dayNo();
      recordDaily(z, n);
      $('lvlstars').textContent = starStr(daily.done[z]);
    } else {
      setStars(tier, idx, n);
      $('lvlstars').textContent = starStr(starsFor(tier,idx));
    }
    $('msg').className='msg ok';
    var t=curTime(), par=parNow();
    var why = (n===3) ? tr('underPar')
            : (usedHint && t<=par) ? tr('hintUsed')
            : (!clean && t<=par) ? tr('undoUsed')
            : tr('parIs',{t:fmt(par)});
    var shareBtn='';
    if(tier==='daily'){
      lastShare.match = shareText(tr('matchTitle'), n, t, dayNo());
      shareBtn = ' <button class="sharebtn" data-share="match">'+tr('shareBtn')+'</button>';
    }
    $('msg').innerHTML = '<span class="big">'+starStr(n)+'</span>'
      + e + ' &nbsp;&middot;&nbsp; ' + fmt(t) + ' &nbsp;&middot;&nbsp; ' + why + shareBtn;
    return;
  }
  if(hist.length >= lev().m){
    badCells = malformed();
    if(badCells.length){
      var k=tok[badCells[0]];
      flash(k.t==='d' ? tr('badDigit')
          : k.t==='o' ? tr('badOp')
          : tr('badEquals'), 'no');
    } else {
      flash(tr('notTrue',{e:e}),'no');
    }
  } else { badCells=[]; $('msg').textContent=''; }
}
function flash(t,c){ var m=$('msg'); m.textContent=t; m.className='msg '+(c||''); }

$('undo').onclick = function(){
  if(!hist.length) return;
  tok=hist.pop(); sel=null; solved=false; clean=false; hint=null; badCells=[];
  $('msg').textContent=''; $('msg').className='msg';
  draw();
};
$('reset').onclick = function(){

$('home24btn').onclick  = function(){ if(!goBackScreen()) showHome(); };

  });

$('cardarea').addEventListener('click', function(ev){

wireShare($('msg'), 'match');
wireShare($('msg24'), 'g24');
$('langbtn').onclick = function(){ $('langlist').classList.toggle('open'); };
$('langlist').addEventListener('click', function(ev){

var t24Btns=document.querySelectorAll('.tier[data-t24]');
for(var qi=0; qi<t24Btns.length; qi++){
  (function(btn){

for(var bi=0; bi<tierBtns.length; bi++){

    var t=btn.getAttribute('data-tier');
    if(!t || !PACKS[t]) return;
    btn.onclick = function(){ openTier(t); pushScreen('game'); };

}

/* ---------- install prompt ----------
   Android Chrome can trigger a real one-tap install via beforeinstallprompt;
   iOS Safari exposes no such API at all, so the only thing that works there
   is an on-screen instruction pointing at the Share button. Both funnel into
   one dismissible banner on the home screen. */
function isStandalone(){
  try{
    return (typeof window !== 'undefined' && window.matchMedia && matchMedia('(display-mode: standalone)').matches)
        || navigator.standalone === true;
  }catch(err){ return false; }
}
function isIOS(){
  try{ return /iphone|ipad|ipod/i.test(navigator.userAgent || ''); }catch(err){ return false; }
}
function installDismissed(){
  try{ return localStorage.getItem('ms_install_dismissed') === '1'; }catch(err){ return false; }
}
function dismissInstallBar(){
  try{ localStorage.setItem('ms_install_dismissed', '1'); }catch(err){}
  $('installbar').style.display = 'none';
}
var deferredInstallPrompt = null;
function refreshInstallBar(){
  if(installDismissed() || isStandalone()){ $('installbar').style.display = 'none'; return; }
  if(deferredInstallPrompt){
    $('installtext').textContent = tr('installAndroidText');
    $('installbtn').textContent = tr('installBtn');
    $('installbtn').style.display = '';
    $('installbar').style.display = 'flex';
  } else if(isIOS()){
    $('installtext').textContent = tr('installIOSText');
    $('installbtn').style.display = 'none';
    $('installbar').style.display = 'flex';
  } else {
    $('installbar').style.display = 'none';
  }
}
$('installbtn').onclick = function(){
  if(!deferredInstallPrompt) return;
  var p = deferredInstallPrompt;
  deferredInstallPrompt = null;
  p.prompt();
  p.userChoice.then(function(){ refreshInstallBar(); }).catch(function(){});
};
$('installclose').onclick = function(){ dismissInstallBar(); };
if(typeof window !== 'undefined'){
  window.addEventListener('beforeinstallprompt', function(ev){
    ev.preventDefault();
    deferredInstallPrompt = ev;
    refreshInstallBar();
  });
  window.addEventListener('appinstalled', function(){
    deferredInstallPrompt = null;
    dismissInstallBar();
  });
}

/* offline shell: guarded so it's a no-op in the Node test harness, where
   neither navigator nor window exist */
if(typeof navigator !== 'undefined' && navigator.serviceWorker && typeof window !== 'undefined'){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
